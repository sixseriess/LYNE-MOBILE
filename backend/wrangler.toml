name = "lyne-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
CORS_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "lyne-catalog"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "lyne-media"

[observability]
enabled = true
