name: Deploy LYNE API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyne-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm install

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LYNE_AUTH_SECRET: ${{ secrets.LYNE_AUTH_SECRET }}
          LYNE_ADMIN_API_TOKEN: ${{ secrets.LYNE_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LYNE_AUTH_SECRET LYNE_ADMIN_API_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error title=Missing secret::$key is not set in Repository Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
          if [[ "${#LYNE_AUTH_SECRET}" -lt 32 || "${#LYNE_ADMIN_API_TOKEN}" -lt 24 ]]; then
            echo "::error title=Weak LYNE secrets::Use long random values for LYNE_AUTH_SECRET and LYNE_ADMIN_API_TOKEN."
            exit 1
          fi

      - name: Create or reuse Cloudflare resources
        id: resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-cloudflare-resources.mjs

      - name: Insert D1 database ID
        env:
          LYNE_D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("wrangler.toml")
          data = path.read_text()
          database_id = os.environ["LYNE_D1_DATABASE_ID"].strip()
          if "REPLACE_WITH_D1_DATABASE_ID" not in data:
              raise SystemExit("Expected D1 placeholder was not found in wrangler.toml.")
          path.write_text(data.replace("REPLACE_WITH_D1_DATABASE_ID", database_id))
          PY

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply lyne-catalog --remote

      - name: Publish Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure private Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LYNE_AUTH_SECRET: ${{ secrets.LYNE_AUTH_SECRET }}
          LYNE_ADMIN_API_TOKEN: ${{ secrets.LYNE_ADMIN_API_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APPLE_MUSIC_DEVELOPER_TOKEN: ${{ secrets.APPLE_MUSIC_DEVELOPER_TOKEN }}
        run: |
          set -euo pipefail
          put_secret() {
            local secret_name="$1"
            local secret_value="$2"
            if [[ -n "$secret_value" ]]; then
              printf '%s' "$secret_value" | npx wrangler secret put "$secret_name" >/dev/null
              echo "$secret_name configured"
            fi
          }
          put_secret AUTH_SECRET "$LYNE_AUTH_SECRET"
          put_secret ADMIN_API_TOKEN "$LYNE_ADMIN_API_TOKEN"
          put_secret SPOTIFY_CLIENT_ID "$SPOTIFY_CLIENT_ID"
          put_secret SPOTIFY_CLIENT_SECRET "$SPOTIFY_CLIENT_SECRET"
          put_secret SOUNDCLOUD_CLIENT_ID "$SOUNDCLOUD_CLIENT_ID"
          put_secret SOUNDCLOUD_CLIENT_SECRET "$SOUNDCLOUD_CLIENT_SECRET"
          put_secret YOUTUBE_API_KEY "$YOUTUBE_API_KEY"
          put_secret APPLE_MUSIC_DEVELOPER_TOKEN "$APPLE_MUSIC_DEVELOPER_TOKEN"

      - name: Publish Worker with secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
