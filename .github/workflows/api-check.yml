name: Check LYNE API
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/api-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/api-check.yml"
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: backend
        run: npm install
      - name: Type-check API Worker
        working-directory: backend
        run: npx tsc --noEmit
